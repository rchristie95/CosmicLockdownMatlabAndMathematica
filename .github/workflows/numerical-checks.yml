name: Numerical checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy matplotlib
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cmake -S cpp/cosmic_lockdown -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: End-to-end workflows, analytic checks and refinements
        env:
          FOCK_BINARY: ${{ runner.os == 'Windows' && 'build/Release/cosmic_fock.exe' || 'build/cosmic_fock' }}
          MEDIA_FLAG: ${{ runner.os == 'Linux' && '--media' || '' }}
        shell: bash
        run: python tests/test_fock_workflows.py "$FOCK_BINARY" $MEDIA_FLAG
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: fock-reference-data
          path: build/fock-verification/
          retention-days: 14
  matlab:
    needs: cpp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fock-reference-data
          path: build/fock-verification
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); run_position_monitoring_tests; run_fock_port_tests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-parity-report
          path: build/fock-verification/matlab-parity.csv
